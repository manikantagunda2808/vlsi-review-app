<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLSI Review App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2e3148;
      border-radius: 12px;
      padding: 2.5rem;
      width: 400px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #ffffff;
    }
    p.sub {
      font-size: 13px;
      color: #7a7f9a;
      margin-bottom: 1.8rem;
    }
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #2e3148;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #7a7f9a;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: #6c63ff;
      border-bottom-color: #6c63ff;
    }
    .form-step { display: none; }
    .form-step.active { display: block; }
    label {
      font-size: 12px;
      color: #9a9fb5;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #0f1117;
      border: 1px solid #2e3148;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus { border-color: #6c63ff; }
    input:disabled { opacity: 0.5; }
    button {
      width: 100%;
      padding: 11px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #574fd6; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      font-size: 12px;
      color: #ff6b6b;
      margin-top: 8px;
      display: none;
    }
    .success {
      font-size: 12px;
      color: #00c896;
      margin-top: 8px;
      display: none;
    }
    .back-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 13px;
      color: #7a7f9a;
    }
    .back-link span {
      color: #6c63ff;
      cursor: pointer;
    }
    .otp-input {
      text-align: center;
      font-size: 24px;
      letter-spacing: 8px;
      font-family: monospace;
    }
    .info-text {
      font-size: 12px;
      color: #7a7f9a;
      text-align: center;
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .resend {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
    }
    .resend a {
      color: #6c63ff;
      cursor: pointer;
      text-decoration: none;
    }
    .resend a:disabled { color: #7a7f9a; cursor: default; }
    .timer { color: #7a7f9a; }
  </style>
</head>
<body>
<div class="card">
  <h1><img src="Vaaluka Logo.png" style="height:32px;vertical-align:middle;margin-right:10px" alt=""> VLSI Review</h1>
  <p class="sub">AI-powered code review for VLSI assignments</p>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">Login</div>
    <div class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <!-- Step 1: Email (and name for signup) -->
  <div id="stepEmail">
    <div id="loginEmailForm">
      <label>Email (@vaaluka.com)</label>
      <input type="email" id="loginEmail" placeholder="you@vaaluka.com">
      <button id="sendLoginOtpBtn" onclick="sendOtp('login')">Send OTP</button>
    </div>
    <div id="signupEmailForm" style="display:none">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="Your name">
      <label>Email (@vaaluka.com)</label>
      <input type="email" id="signupEmail" placeholder="you@vaaluka.com">
      <button id="sendSignupOtpBtn" onclick="sendOtp('signup')">Send OTP</button>
    </div>
    <div class="error" id="stepError"></div>
  </div>

  <!-- Step 2: OTP Verification -->
  <div id="stepOtp" style="display:none">
    <p class="info-text" id="otpSentTo">OTP sent to <strong id="otpEmail"></strong></p>
    <label>Enter OTP</label>
    <input type="text" id="otpInput" class="otp-input" maxlength="6" placeholder="000000" inputmode="numeric" autocomplete="one-time-code">
    <button id="verifyOtpBtn" onclick="verifyOtp()">Verify & Continue</button>
    <div class="error" id="otpError"></div>
    <div class="resend">
      <span class="timer" id="resendTimer">Resend in 30s</span>
      <a id="resendLink" style="display:none" onclick="resendOtp()">Resend OTP</a>
    </div>
    <div class="back-link"><span onclick="goBack()">← Change email</span></div>
  </div>
</div>

<script>
  const API = "";
  let currentMode = "login";
  let pendingEmail = "";
  let pendingName = "";
  let resendTimeout = null;
  let resendCountdown = 30;

  function switchTab(mode) {
    currentMode = mode;
    document.getElementById("tabLogin").classList.toggle("active", mode === "login");
    document.getElementById("tabSignup").classList.toggle("active", mode === "signup");
    document.getElementById("loginEmailForm").style.display = mode === "login" ? "block" : "none";
    document.getElementById("signupEmailForm").style.display = mode === "signup" ? "block" : "none";
    document.getElementById("stepOtp").style.display = "none";
    document.getElementById("stepEmail").style.display = "block";
    document.getElementById("stepError").style.display = "none";
  }

  async function sendOtp(mode) {
    const emailInput = mode === "login" ? "loginEmail" : "signupEmail";
    const email = document.getElementById(emailInput).value.trim().toLowerCase();
    const btnId = mode === "login" ? "sendLoginOtpBtn" : "sendSignupOtpBtn";
    const btn = document.getElementById(btnId);

    if (!email.endsWith("@vaaluka.com")) {
      showError("Only @vaaluka.com emails allowed");
      return;
    }

    let name = "";
    if (mode === "signup") {
      name = document.getElementById("signupName").value.trim();
      if (!name) { showError("Please enter your name"); return; }
    }

    pendingEmail = email;
    pendingName = name;
    btn.disabled = true;
    btn.textContent = "Sending...";

    const res = await fetch(`${API}/auth/send-otp`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, name: name || undefined })
    });

    btn.disabled = false;
    btn.textContent = "Send OTP";

    if (res.ok) {
      document.getElementById("stepEmail").style.display = "none";
      document.getElementById("stepOtp").style.display = "block";
      document.getElementById("otpEmail").textContent = email;
      document.getElementById("otpInput").value = "";
      document.getElementById("otpError").style.display = "none";
      startResendTimer();
    } else {
      const data = await res.json();
      showError(data.detail || "Failed to send OTP");
    }
  }

  async function verifyOtp() {
    const otp = document.getElementById("otpInput").value.trim();
    if (!otp || otp.length !== 6) {
      document.getElementById("otpError").textContent = "Enter the 6-digit OTP";
      document.getElementById("otpError").style.display = "block";
      return;
    }

    const btn = document.getElementById("verifyOtpBtn");
    btn.disabled = true;
    btn.textContent = "Verifying...";

    const res = await fetch(`${API}/auth/verify-otp`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: pendingEmail, otp })
    });

    btn.disabled = false;
    btn.textContent = "Verify & Continue";

    if (res.ok) {
      const data = await res.json();
      localStorage.setItem("email", pendingEmail);
      localStorage.setItem("token", data.access_token);
      localStorage.setItem("name", data.name);
      localStorage.setItem("role", data.role);
      localStorage.setItem("user_id", data.user_id);

      if (data.role === "senior") {
        window.location.href = "/senior.html";
      } else {
        window.location.href = "/junior.html";
      }
    } else {
      const data = await res.json();
      document.getElementById("otpError").textContent = data.detail || "Invalid OTP. Try again.";
      document.getElementById("otpError").style.display = "block";
    }
  }

  function resendOtp() {
    if (resendTimeout) {
      clearInterval(resendTimeout);
      resendTimeout = null;
    }
    sendOtp(currentMode);
  }

  function startResendTimer() {
    resendCountdown = 30;
    document.getElementById("resendTimer").style.display = "inline";
    document.getElementById("resendLink").style.display = "none";

    if (resendTimeout) clearInterval(resendTimeout);
    resendTimeout = setInterval(() => {
      resendCountdown--;
      document.getElementById("resendTimer").textContent = `Resend in ${resendCountdown}s`;
      if (resendCountdown <= 0) {
        clearInterval(resendTimeout);
        resendTimeout = null;
        document.getElementById("resendTimer").style.display = "none";
        document.getElementById("resendLink").style.display = "inline";
      }
    }, 1000);
  }

  function goBack() {
    document.getElementById("stepOtp").style.display = "none";
    document.getElementById("stepEmail").style.display = "block";
    if (resendTimeout) {
      clearInterval(resendTimeout);
      resendTimeout = null;
    }
  }

  function showError(msg) {
    const el = document.getElementById("stepError");
    el.textContent = msg;
    el.style.display = "block";
  }
</script>
</body>
</html>
