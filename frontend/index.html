<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLSI Review App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 2.5rem;
      width: 400px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1f2937;
    }
    p.sub {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 1.8rem;
    }
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #d1d5db;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: #2D3270;
      border-bottom-color: #2D3270;
    }
    .form-pane { display: none; }
    .form-pane.active { display: block; }
    label {
      font-size: 12px;
      color: #6b7280;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #1f2937;
      font-size: 14px;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus { border-color: #2D3270; }
    input:disabled { opacity: 0.5; }
    button {
      width: 100%;
      padding: 11px;
      background: #2D3270;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #25295e; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      font-size: 12px;
      color: #dc2626;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <h1><img src="Vaaluka Logo.png" style="height:40px;vertical-align:middle;margin-right:10px" alt=""> VLSI Review</h1>
  <p class="sub">AI-powered code review for VLSI assignments</p>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">Login</div>
    <div class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <div class="form-pane active" id="paneLogin">
    <label>Email (@vaaluka.com)</label>
    <input type="email" id="loginEmail" placeholder="you@vaaluka.com">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Enter your password">
    <button id="loginBtn" onclick="login()">Login</button>
    <div class="error" id="loginError"></div>
  </div>

  <div class="form-pane" id="paneSignup">
    <label>Full Name</label>
    <input type="text" id="signupName" placeholder="Your name">
    <label>Email (@vaaluka.com)</label>
    <input type="email" id="signupEmail" placeholder="you@vaaluka.com">
    <label>Password</label>
    <input type="password" id="signupPassword" placeholder="Create a password">
    <button id="signupBtn" onclick="signup()">Sign Up</button>
    <div class="error" id="signupError"></div>
  </div>
</div>

<script>
  const API = "";

  function switchTab(mode) {
    document.getElementById("tabLogin").classList.toggle("active", mode === "login");
    document.getElementById("tabSignup").classList.toggle("active", mode === "signup");
    document.getElementById("paneLogin").classList.toggle("active", mode === "login");
    document.getElementById("paneSignup").classList.toggle("active", mode === "signup");
    document.getElementById("loginError").style.display = "none";
    document.getElementById("signupError").style.display = "none";
  }

  function handleAuthResponse(res, data) {
    if (res.ok) {
      localStorage.setItem("email", data.email || "");
      localStorage.setItem("token", data.access_token);
      localStorage.setItem("name", data.name);
      localStorage.setItem("role", data.role);
      localStorage.setItem("user_id", data.user_id);

      const redirect = localStorage.getItem("redirectAfterLogin");
      if (redirect) {
        localStorage.removeItem("redirectAfterLogin");
        window.location.href = redirect;
      } else if (data.role === "senior") {
        window.location.href = "/senior.html";
      } else {
        window.location.href = "/junior.html";
      }
      return true;
    }
    return false;
  }

  async function login() {
    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("loginError");

    if (!email.endsWith("@vaaluka.com")) {
      errorEl.textContent = "Only @vaaluka.com emails allowed";
      errorEl.style.display = "block";
      return;
    }
    if (!password) {
      errorEl.textContent = "Enter your password";
      errorEl.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Logging in...";
    errorEl.style.display = "none";

    const res = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    btn.disabled = false;
    btn.textContent = "Login";

    if (!handleAuthResponse(res, await res.json())) {
      const data = await res.json();
      errorEl.textContent = data.detail || "Login failed";
      errorEl.style.display = "block";
    }
  }

  async function signup() {
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim().toLowerCase();
    const password = document.getElementById("signupPassword").value;
    const btn = document.getElementById("signupBtn");
    const errorEl = document.getElementById("signupError");

    if (!name) {
      errorEl.textContent = "Please enter your name";
      errorEl.style.display = "block";
      return;
    }
    if (!email.endsWith("@vaaluka.com")) {
      errorEl.textContent = "Only @vaaluka.com emails allowed";
      errorEl.style.display = "block";
      return;
    }
    if (!password) {
      errorEl.textContent = "Create a password";
      errorEl.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creating account...";
    errorEl.style.display = "none";

    const res = await fetch(`${API}/auth/signup`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, name })
    });

    btn.disabled = false;
    btn.textContent = "Sign Up";

    if (!handleAuthResponse(res, await res.json())) {
      const data = await res.json();
      errorEl.textContent = data.detail || "Signup failed";
      errorEl.style.display = "block";
    }
  }
</script>
</body>
</html>
